[pytest]
testpaths = tests
# `-m "not slow"` by default: the suite is the inner feedback loop and needs to stay
# seconds, not minutes. The excluded tests each train sequence models end-to-end. Run
# everything with `make test-all` (or `pytest -m ""`); CI runs the full set.
addopts = -q --strict-markers -m "not slow"
markers =
    slow: trains models end-to-end; excluded from the default run
filterwarnings =
    error::DeprecationWarning:src.*
