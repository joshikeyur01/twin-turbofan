[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    # Training scripts set the matplotlib Agg backend before importing pyplot, which
    # requires imports below the top of the file.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Re-exported for backwards compatibility with the pre-harness import paths.
"src/model_lstm.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Pragmatic settings: this is numeric code leaning on untyped scientific libraries,
# so requiring stubs for everything buys noise rather than safety. Tighten later.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
